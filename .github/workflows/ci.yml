# The checks on every pull request and every push to main, on Linux and on
# Windows (docs/10-install-update-and-releases.md, "Checks on every pull
# request").
#
# Windows is a real Windows machine (GitHub's hosted windows-latest), not a
# container: the program is built for Windows and runs there, so the lock, the
# console attach and the second-start hand-off are tested where they will run.
# Printing can't be tested anywhere; the request a printer receives can, and
# will be, once there is one to send.
#
# Actions are pinned by commit, with the version beside it; Dependabot moves
# both together (.github/dependabot.yml). The SHAs are the ones stewards uses.
name: CI

on:
  pull_request:
  push:
    branches: [main]

  # For go-version.yml: a pull request opened with the repository's own token
  # starts no workflow, so that workflow starts this one on its branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # From go.mod, so the toolchain in CI is the one the module declares
          # and there is no second place to bump.
          go-version-file: go.mod
          cache: true

      - name: lint (vet for Linux and Windows, gofmt)
        run: make lint

      - name: go.mod and go.sum are tidy
        run: make tidy-check

      - name: unit tests, with the race detector
        run: make test-unit

      - name: the IPP client against a real IPP implementation (ippeveprinter, on loopback)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cups-ipp-utils
          make ipp-interop

      # The pages' scripts are plain JavaScript modules with no build step, so
      # nothing else would notice one breaking until a check was being
      # written. Node's own test runner, so there is nothing to install from
      # npm; Node itself is pinned, because the browser tests need 22 or
      # later. The SHA is the one stewards uses.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: JavaScript tests
        run: make test-js

      # In the runner's own Chrome, against the program built from this
      # commit, on a test config whose printer is a folder: the preview and
      # the Print button following the typing, and a check written, printed
      # and confirmed, under the real header policy. CI is set here, so a
      # missing Chrome fails this step rather than skipping it.
      - name: browser tests
        timeout-minutes: 10
        run: make test-browser

      - name: every target system builds
        run: make cross

      - name: vulnerability scan
        run: make vuln-check

      - name: the release binaries build
        run: make release-all VERSION=v0.0.0-ci && make checksums && ls -l dist

  # The program updating itself, end to end: real binaries built with a
  # throwaway key, against a fake GitHub on a Docker network with no way out
  # (scripts/selfupdate-e2e/run). A job of its own because it takes a few
  # minutes and needs only Docker, which the runner has.
  selfupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: self-update, end to end
        run: make selfupdate-e2e

  windows:
    runs-on: windows-latest

    # Git Bash, so scripts/go-test runs as it does on Linux. make is not on
    # the runner, so the steps call go directly.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: unit tests, with the race detector
        run: GO=go scripts/go-test -race ./...

      - name: the GUI build, as released, starts and answers version
        run: |
          go build -ldflags='-s -w -X main.version=v0.0.0-ci -H windowsgui' -o rc.exe ./cmd/reconcile-checks
          out=$(./rc.exe version)
          echo "$out"
          [[ "$out" == "reconcile-checks v0.0.0-ci windows/amd64 "* ]] || { echo "the GUI build did not print its version"; exit 1; }

      # Installing itself, as a release does on its first run, into a
      # %LocalAppData% and %AppData% of the step's own: the program copied in,
      # the Start menu shortcut written through WScript.Shell and pointing at
      # it, read back the same way Windows reads it; then uninstall removes
      # both.
      - name: installing itself, and the Start menu shortcut
        run: |
          go build -ldflags='-s -w -X main.version=v0.0.1 -H windowsgui' -o rc-install.exe ./cmd/reconcile-checks

          mkdir -p "$RUNNER_TEMP/local" "$RUNNER_TEMP/roaming"
          export LOCALAPPDATA="$(cygpath -w "$RUNNER_TEMP/local")"
          export APPDATA="$(cygpath -w "$RUNNER_TEMP/roaming")"

          ./rc-install.exe install

          exe="$RUNNER_TEMP/local/Programs/reconcile-checks/reconcile-checks.exe"
          out=$("$exe" version)
          echo "$out"
          [[ "$out" == "reconcile-checks v0.0.1 windows/amd64 "* ]] || { echo "the installed program doesn't run"; exit 1; }

          lnk="$(cygpath -w "$RUNNER_TEMP/roaming/Microsoft/Windows/Start Menu/Programs/Reconcile Checks.lnk")"
          target=$(powershell -NoProfile -Command "(New-Object -ComObject WScript.Shell).CreateShortcut('$lnk').TargetPath" | tr -d '\r')
          echo "the shortcut points at $target"
          [ "${target,,}" = "$(cygpath -w "$exe" | tr '[:upper:]' '[:lower:]')" ] || { echo "it should point at the installed program"; exit 1; }

          ./rc-install.exe uninstall
          [ ! -e "$exe" ] || { echo "uninstall left the program"; exit 1; }
          [ ! -e "$(cygpath -u "$lnk")" ] || { echo "uninstall left the shortcut"; exit 1; }
