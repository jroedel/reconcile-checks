# Reconcile Checks' settings, documented. The real file is config.toml:
#
#   Linux    ~/.config/reconcile-checks/config.toml
#   Windows  %AppData%\reconcile-checks\config.toml
#
# Every setting has a default, so the program runs with no file at all. Later
# versions will write this file from the Settings page (printers, accounts,
# offsets); when they do, comments written into it by hand do not survive.
#
# For development: `make run` uses ./config.toml, whose data folder is ./data
# unless set below -- never the real register (CLAUDE.md, section 6).

# Where the register, the lock, runtime.json and the log live. A relative
# folder is relative to this file. Unset: the system's place for it
# (~/.local/share/reconcile-checks, or %LocalAppData%\reconcile-checks), or,
# with --config, a folder named data beside the config file.
# data = "data"

# The Reconcile this computer signs in to and sends checks to. Unset: the
# one the program was built for. With --config (development), unset means
# none: set it to a Reconcile running on this computer, such as
# "http://127.0.0.1:8461" from ../reconcile, never the real one.
# reconcile = "http://127.0.0.1:8461"

# The port the app is served on, on 127.0.0.1 only. If something else holds it,
# the program uses any free port instead.
# port = 7461

# How long the program waits with no page open before it closes.
# close_after = "2m"

# debug, info, warn or error.
# log_level = "info"

# --- Printers and accounts ----------------------------------------------------
#
# Written by Settings (Add a printer, Add an account); shown here so the file
# can be read. The program never needs more of an account number than its
# last four.

# [[printer]]
# name = "Office M612"                              # what Settings calls it
# url  = "ipps://NPI46CBDF.local:631/ipp/print"     # its IPP address; "file:<dir>" in development
# pin  = "…"                                        # its certificate's SHA-256, remembered when added
# tray       = "tray-1"                  # the tray checks go in (the default)
# media_type = "stationery-preprinted"   # the printer's name for check stock (the default)
# feed       = "face up, stubs in first"   # which way up, settled once with a marked sheet (the default)
# [printer.offset_mm]                    # from the calibration page: + is right and down, for every account's checks
# x = 0.0
# y = 0.0

# [[account]]
# key        = "checking-a"              # this computer's name for it: its folder of checks. Never changes.
# name       = "Checking A"
# last4      = "1234"                    # for the image: XXXXXX1234
# stock      = "walmart-voucher-top"     # the layout, from layouts/
# printer    = "Office M612"             # a [[printer]]'s name: its tray, feed and offset are used
# ceiling    = "10,000.00"               # above it, an amount is asked about again
# reconcile_id = "…"                     # Reconcile's id for it, chosen in Settings once signed in
